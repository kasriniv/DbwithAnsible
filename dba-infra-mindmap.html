<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBA Infra Mindmap</title>
<style>
  :root {
    --bg: #0d1117;
    --text: #c9d1d9;
    --muted: #8b949e;
    --line: #30363d;
    --surface: #161b22;
    --root: #58a6ff;
    --provisioning: #58a6ff;
    --patching: #f0883e;
    --scaling: #79c0ff;
    --decommission: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 24px 28px 8px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 600;
  }
  .sub {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 14px;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  button.tool {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.tool:hover { border-color: var(--root); color: var(--root); }
  .wrap {
    overflow: auto;
    padding: 12px 28px 40px;
  }
  .mindmap {
    display: flex;
    align-items: center;
    min-width: max-content;
    gap: 0;
  }
  .root-node, .branch-node, .leaf {
    width: 240px;
    min-height: 44px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    line-height: 1.25;
  }
  .root-node {
    background: var(--root);
    border-color: var(--root);
    color: #0d1117;
    font-weight: 600;
  }
  .title { font-size: 13px; font-weight: 600; }
  .branch-node {
    cursor: pointer;
    font-weight: 600;
    width: 200px;
  }
  .branch-node[data-id="provisioning"] { border-color: var(--provisioning); color: var(--provisioning); }
  .branch-node[data-id="patching"] { border-color: var(--patching); color: var(--patching); }
  .branch-node[data-id="scaling"] { border-color: var(--scaling); color: var(--scaling); }
  .branch-node[data-id="decommission"] { border-color: var(--decommission); color: var(--decommission); }
  .leaf .title { font-weight: 500; }
  .connector {
    width: 36px;
    height: 2px;
    background: var(--line);
    flex-shrink: 0;
  }
  .branches {
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
    padding-left: 18px;
  }
  .branches::before {
    content: "";
    position: absolute;
    left: 0;
    top: 28px;
    bottom: 28px;
    width: 2px;
    background: var(--line);
  }
  .row {
    display: flex;
    align-items: center;
    position: relative;
  }
  .row::before {
    content: "";
    position: absolute;
    left: -18px;
    width: 18px;
    height: 2px;
    background: var(--line);
    top: 50%;
  }
  .leaves {
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    padding-left: 18px;
  }
  .leaves::before {
    content: "";
    position: absolute;
    left: 0;
    top: 28px;
    bottom: 28px;
    width: 2px;
    background: var(--line);
  }
  .leaf-row {
    display: flex;
    align-items: center;
    position: relative;
  }
  .leaf-row::before {
    content: "";
    position: absolute;
    left: -18px;
    width: 18px;
    height: 2px;
    background: var(--line);
    top: 50%;
  }
  .row.collapsed .leaves,
  .row.collapsed .leaves-connector {
    display: none;
  }
  .leaves-connector { width: 36px; height: 2px; background: var(--line); flex-shrink: 0; }
  .source {
    padding: 0 28px 28px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <header>
    <h1>DBA Infra Mindmap</h1>
    <p class="sub">Mindmap from dba-infra-workflows. Click a branch to collapse or expand.</p>
    <div class="toolbar">
      <button class="tool" id="expand-all" type="button">Expand all</button>
      <button class="tool" id="collapse-all" type="button">Collapse all</button>
    </div>
  </header>
  <div class="wrap">
    <div class="mindmap" id="mindmap"></div>
  </div>
  <p class="source">Source: dba-infra-workflows.html</p>

<script>
const BRANCHES = [
  {
    id: "provisioning",
    label: "Provisioning",
    children: [
      { label: "Host OS & Kernel Tuning" },
      { label: "Storage Partitioning" },
      { label: "Engine Installation and Bootstrap" }
    ]
  },
  {
    id: "patching",
    label: "Host Maintenance",
    children: [
      { label: "Isolate & Drain" },
      { label: "Host Patch and Reboot" },
      { label: "Catch-up Sync" },
      { label: "Restore Traffic" }
    ]
  },
  {
    id: "scaling",
    label: "Scaling",
    children: [
      { label: "New Compute" },
      { label: "Physical Base Backup" },
      { label: "Establish Replication" }
    ]
  },
  {
    id: "decommission",
    label: "Decommissioning",
    children: [
      { label: "Drop from Cluster" },
      { label: "Sanitize Disks" },
      { label: "Terminate Instance" }
    ]
  }
];

const open = { provisioning: true, patching: true, scaling: true, decommission: true };

function render() {
  const root = document.getElementById("mindmap");
  const rows = BRANCHES.map((branch) => {
    const expanded = open[branch.id];
    const leaves = branch.children.map((child) => `
      <div class="leaf-row">
        <div class="leaf">
          <div class="title">${child.label}</div>
        </div>
      </div>
    `).join("");
    return `
      <div class="row ${expanded ? "" : "collapsed"}" data-branch="${branch.id}">
        <button class="branch-node" type="button" data-id="${branch.id}" aria-expanded="${expanded}">
          ${expanded ? "−" : "+"} ${branch.label}
        </button>
        <div class="leaves-connector"></div>
        <div class="leaves">${leaves}</div>
      </div>
    `;
  }).join("");

  root.innerHTML = `
    <div class="root-node">
      DBA Infrastructure Workflows
    </div>
    <div class="connector"></div>
    <div class="branches">${rows}</div>
  `;

  root.querySelectorAll(".branch-node").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-id");
      open[id] = !open[id];
      render();
    });
  });
}

document.getElementById("expand-all").addEventListener("click", () => {
  Object.keys(open).forEach((k) => { open[k] = true; });
  render();
});
document.getElementById("collapse-all").addEventListener("click", () => {
  Object.keys(open).forEach((k) => { open[k] = false; });
  render();
});

render();
</script>
</body>
</html>
